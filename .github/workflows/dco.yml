name: DCO

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-24.04
    steps:
      - name: Check DCO sign-off
        uses: KineticCafe/actions-dco@e9627100b7f566546e67cde54bfa7d3790ab649b # v4.0.0
        with:
          config: |
            bots.policy = "none"
            bots.allow = ["dependabot[bot]"]

            [alias-signoffs.aliases]
            "49699333+dependabot[bot]@users.noreply.github.com" = ["support@github.com"]
